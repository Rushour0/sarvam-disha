# Coolify deployment for Disha.
#
# Add this repo in Coolify as a "Docker Compose" resource pointing at this file.
# Coolify builds the image once and reuses it for all three services, wires them
# onto a per-resource network, and puts Traefik in front of anything carrying a
# SERVICE_FQDN_* variable.
#
# Qdrant is declared here rather than reused from another project. The box
# already runs a Qdrant that belongs to the ludexel stack, and pointing Disha at
# it would put student conversation memory inside an unrelated product's volume,
# with its backup and retention policy rather than Disha's.
#
# Required environment variables, set in the Coolify UI (never committed):
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#   SARVAM_API_KEY
#   OPENAI_API_KEY
# Optional:
#   DISHA_LLM (default sarvam/sarvam-30b; openai/gpt-4.1-mini also supported)

services:
  sarvam-qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes:
      - sarvam-qdrant-storage:/qdrant/storage
    healthcheck:
      # Qdrant's image has no shell utilities beyond this, so use its own binary.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs once per deploy, then exits. Building the index inside the agent's
  # startup would delay the first call and re-embed on every restart.
  sarvam-indexer:
    image: ghcr.io/rushour0/sarvam-disha-agent:latest
    restart: "no"
    command: ["python", "scripts/index_kb.py"]
    environment:
      - QDRANT_URL=http://sarvam-qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      sarvam-qdrant:
        condition: service_healthy

  sarvam-agent:
    image: ghcr.io/rushour0/sarvam-disha-agent:latest
    restart: unless-stopped
    command: ["python", "main.py", "start"]
    working_dir: /app/agent
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # sarvam/<model> routes through the Sarvam chat completions API using
      # SARVAM_API_KEY. sarvam-30b is the plugin's own default; sweep against
      # sarvam-m (cheaper) and sarvam-105b (stronger tool use) on real calls.
      - DISHA_LLM=${DISHA_LLM:-sarvam/sarvam-30b}
      - QDRANT_URL=http://sarvam-qdrant:6333
    volumes:
      - sarvam-disha-cases:/app/agent/cases
    depends_on:
      sarvam-qdrant:
        condition: service_healthy

  sarvam-api:
    image: ghcr.io/rushour0/sarvam-disha-agent:latest
    restart: unless-stopped
    command:
      ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8090"]
    working_dir: /app/api
    # No SERVICE_FQDN: /cases serves phone numbers and verbatim wellbeing
    # quotes, so the API stays on the internal network and is reached only
    # through the web container's /api/disha proxy.
    environment:
      - DISHA_CASES_DIR=/app/agent/cases
      # Signs the disha_session login cookie. Falls back to a demo value in
      # code; set a real one in Coolify before real traffic.
      - DISHA_SESSION_SECRET=${DISHA_SESSION_SECRET:-}
    volumes:
      # Read-write: the API serves what the worker wrote AND appends the
      # signup event that /signup (phone + OTP login) persists. A :ro mount
      # here made every login 500 with "Read-only file system".
      - sarvam-disha-cases:/app/agent/cases
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  sarvam-web:
    image: ghcr.io/rushour0/sarvam-disha-web:latest
    restart: unless-stopped
    environment:
      # The only service with a public domain. Coolify fills this in.
      - SERVICE_FQDN_WEB_3000
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Server-only: the /me guide generator calls OpenAI from the Next server.
      # Never exposed to the client (no NEXT_PUBLIC_ prefix).
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISHA_API_ORIGIN=http://sarvam-api:8090
      - BLOG_ORIGIN=${BLOG_ORIGIN:-https://sarvam-blog.pages.dev}
      # Basic auth for /counsellor and /api/disha/cases. Unset means those
      # routes fail closed rather than serving student PII.
      - DISHA_COUNSELLOR_USER=${DISHA_COUNSELLOR_USER:-counsellor}
      - DISHA_COUNSELLOR_PASSWORD=${DISHA_COUNSELLOR_PASSWORD}
    depends_on:
      sarvam-api:
        condition: service_healthy

volumes:
  sarvam-qdrant-storage:
  sarvam-disha-cases:
